name: Public builder
run-name: private-build-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID
        required: true
      private_run_id:
        description: Private dispatch run ID
        required: true
      sealed_payload_b64:
        description: Encrypted private build parameters
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Quiet private checkout, build, and encrypt
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
          DISPATCH_DECRYPT_KEY: ${{ secrets.DISPATCH_DECRYPT_KEY }}
          INPUT_CERTIFICATE_B64: ${{ vars.INPUT_CERTIFICATE_B64 }}
          SEALED_PAYLOAD_B64: ${{ inputs.sealed_payload_b64 }}
        run: bash scripts/build-and-encrypt.sh
      - name: Upload encrypted result only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-result-${{ inputs.request_id }}
          path: result.cms
          if-no-files-found: error
          retention-days: 1
  callback:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger private collection
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_CALLBACK_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          REQUEST_ID: ${{ inputs.request_id }}
          PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
        run: |
          payload="$(mktemp)"
          jq -n --arg id "$REQUEST_ID" \
            --arg private_run_id "$PRIVATE_RUN_ID" --arg public_run_id "$GITHUB_RUN_ID" \
            '{ref:"main",inputs:{request_id:$id,private_run_id:$private_run_id,public_run_id:$public_run_id}}' \
            > "$payload"
          gh api -X POST "repos/${PRIVATE_REPO}/actions/workflows/collect.yml/dispatches" \
            --input "$payload" >/dev/null
          rm -f "$payload"
          echo 'Private collection requested.'
